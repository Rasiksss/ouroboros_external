[project]
name = "workstation-bwrup"
version = "0.1.0"
description = "Workstation sandbox orchestration service with bwrap and local runtimes"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "ecs-logging>=2.3.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "aiokafka>=0.12",
    "redis>=5.2",
    "opentelemetry-api>=1.39.1",
    "orjson>=3.10",
    "python-json-logger>=3.2",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "click>=8.1",
    "apscheduler>=3.10",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-httpx>=0.34",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-redis>=4.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle + pyflakes
    "I",                 # isort
    "B",                 # flake8-bugbear
    "UP",                # pyupgrade
    "N",                 # pep8-naming
    "SIM",               # flake8-simplify
    "RUF",               # ruff-specific
    "TID",               # flake8-tidy-imports
]
ignore = [
    "B008",     # FastAPI Depends() in defaults
    "N818",     # exception naming (BaseHTTPException)
    "RUF001",   # Cyrillic letters in string literals (Russian-language messages)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/versions", "tests"]

[[tool.mypy.overrides]]
module = "aiokafka.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "ignore::DeprecationWarning:aiokafka.*",
]
