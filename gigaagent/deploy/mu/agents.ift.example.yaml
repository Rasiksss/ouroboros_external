- AGENT_NAME: aifa
  PROBE:
    READINESS:
      PORT: 8080
      PATH: /health
    LIVENESS:
      PORT: 8080
      PATH: /health
  ADDITIONAL_PORTS:
    APP_SERVICE_PORTS:
    - NAME: http-8080
      PROTOCOL: TCP
      PORT: 8080
      TARGET_PORT: 8080
  RESOURCES:
    REPLICAS: 1
    LIMITS:
      CPU: 1000m
      MEMORY: 2Gi
    REQUESTS:
      CPU: 500m
      MEMORY: 1Gi
  ENV:
    FINENGINE_ADMIN_USERNAME: admin
    FINENGINE_ENFORCE_INTERNAL_AUTH: '1'
    FINENGINE_S3_BUCKET: <ISSUED_FINENGINE_BUCKET>
    FINENGINE_S3_REGION: us-east-1
    FINENGINE_WORKSTATION_URL: http://<WORKSTATION_SERVICE>:8080
    FINENGINE_PLANNER_REASONING_EFFORT: medium
    FINENGINE_OUROBOROS_LOOP_MAX_WALL_SEC: '2400'
    FINENGINE_OUROBOROS_SUBTASK_WAIT_SEC: '1200'
    FINENGINE_GRAPH_MIN_WALL_SECONDS: '1800'
    FINENGINE_OUROBOROS_HARD_TIMEOUT_SEC: '5400'
    FINENGINE_HOST: 0.0.0.0
    FINENGINE_PORT: '8080'
    FINENGINE_DATA_DIR: /app/data
    FINENGINE_DOCS_DIR: /app/data/documents
    SECMAN_SECRETS_FILE: /vault/secrets/secret-files/aifa-secrets
    SECMAN_WAIT_SEC: '30'
    SECMAN_POSTGRES_PASSWORD_ENCODING: url
    FINENGINE_OUROBOROS_URL: http://<TRANSPORT_SERVICE>:9090
    FINENGINE_OPENROUTER_MODEL: glm-5.2-mip/glm-5.2-fp8
    FINENGINE_PLANNER_MODEL: glm-5.2-mip/glm-5.2-fp8
    FINENGINE_LOCATE_MODEL: glm-5.2-mip/glm-5.2-fp8
    FINENGINE_READ_VALUE_MODEL: glm-5.2-mip/glm-5.2-fp8
    FINENGINE_NEWS_CLASSIFY_MODEL: glm-5.2-mip/glm-5.2-fp8
    FINENGINE_WORKERS: '1'
    FINENGINE_PG_SCHEMA: finengine
    FINENGINE_S3_ENDPOINT: <ISSUED_S3_CLIENT_URL>
    FINENGINE_OPENROUTER_BASE_URL: <ISSUED_MODEL_BASE_URL>
    FINENGINE_REDIS_URL: ''
- AGENT_NAME: workstation
  PROBE:
    READINESS:
      PORT: 8080
      PATH: /health/readiness
    LIVENESS:
      PORT: 8080
      PATH: /health/liveness
  ADDITIONAL_PORTS:
    APP_SERVICE_PORTS:
    - NAME: http-8080
      PROTOCOL: TCP
      PORT: 8080
      TARGET_PORT: 8080
  RESOURCES:
    REPLICAS: 1
    LIMITS:
      CPU: 800m
      MEMORY: 1500Mi
    REQUESTS:
      CPU: 400m
      MEMORY: 768Mi
  ENV:
    DATABASE_URL: sqlite+aiosqlite:////tmp/workstation.db
    MEMORY_LIMIT_BYTES: '536870912'
    RUNTIME_MODE: local
    APP_LOG_LEVEL: INFO
    APP_HOST: 0.0.0.0
    APP_PORT: '8080'
    SECMAN_SECRETS_FILE: /vault/secrets/secret-files/workstation-secrets
    WORKSPACE_STORE_ENABLED: 'false'
    WORKSPACE_STORE_BACKEND: s3
    WORKSPACE_STORE_S3_BUCKET: agnbf-af-aifaclaw
    WORKSPACE_STORE_S3_ENDPOINT_URL: http://s3-pvsup-edz-03.delta.sbrf.ru:8080
    WORKSPACE_STORE_S3_PREFIX: aifa/workspaces
    WORKSPACE_STORE_RESTORE_TIMEOUT_SEC: '300'
    WORKSPACE_STORE_SNAPSHOT_TIMEOUT_SEC: '300'
    IS_CREATE_SESSION_SECRET: 'true'
    SESSION_IDLE_TIMEOUT_SEC: '900'
    SESSION_ABSOLUTE_TTL_SEC: '3600'
    REDIS_ENABLED: 'false'
