# EXAMPLE: replace all placeholders before applying to a cluster.
GIT_SSH_CREDENTIAL_ID: <JENKINS_GIT_CREDENTIAL>
PASS_CREDENTIAL_ID: <JENKINS_PASS_CREDENTIAL>
DROPAPP_CREDENTIAL_ID: <JENKINS_DROPAPP_CREDENTIAL>
DROPAPP_CLUSTER: <CLUSTER>
DROPAPP_NAMESPACE: <NAMESPACE>
STAND_ID: <STAND_ID>
STAND_TYPE: IFT
SECMAN:
  HOST: <SECMAN_HOST>
  SECRETS_KV_PATH: <TENANT_SECRET_FILES_KV_PATH>
  SECRET_FILES:
  - gigaagent-secrets
  - aifa-secrets
  - workstation-secrets
  SBER_CA_CLIENT_CN: <OUR_CLIENT_CN>
  SBER_CA_SERVER_CN: <OUR_INGRESS_DNS>
  INGRESS_GW_SAN: <OUR_INGRESS_DNS>
ISTIO:
  INGRESS:
    CONNECT_TIMEOUT: 600s
    READ_TIMEOUT: 600s
    SEND_TIMEOUT: 600s
