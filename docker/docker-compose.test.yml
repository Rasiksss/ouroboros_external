# PostgreSQL for `uv run pytest` and `./scripts/check.sh`. There is no other runtime database:
# an absent or unreachable one is an error, never a skipped suite.
#
# Usage:
#   docker compose -f docker/docker-compose.test.yml up -d
#   export OUROBOROS_RUNTIME_DB_URL_1=postgresql+psycopg://ouroboros:ouroboros@localhost:5433/ouroboros_test
#
# Port 5433 keeps this out of the way of a PostgreSQL already listening on 5432. The data
# directory is a tmpfs: every suite recreates its schemas, and nothing here outlives the container.

name: ouroboros-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ouroboros_test
      POSTGRES_USER: ouroboros
      POSTGRES_PASSWORD: ouroboros
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ouroboros -d ouroboros_test"]
      interval: 2s
      timeout: 3s
      retries: 30
