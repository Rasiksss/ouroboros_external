# Хуки локальные (language: system + `uv run`), чтобы ruff и mypy брались из
# uv.lock — те же версии, что в стадии `check` в .gitlab-ci.yml, и чтобы mypy
# видел зависимости проекта.
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format . --check
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        types_or: [python, pyi]
        require_serial: true

      # Конфиг-driven: файлы берутся из [tool.mypy] files в pyproject.toml,
      # проверять только staged-файлы нельзя — mypy даст ложные ошибки.
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
