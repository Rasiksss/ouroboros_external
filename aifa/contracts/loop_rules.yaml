  - id: LR-40
    contract: "**Цикл** открывается только ответом `НУЖЕН_ЦИКЛ` у `aifa_goal`"
    test: tests/loop_tools/test_open_and_restore.py::test_when_the_standard_path_cannot_plan_the_cycle_is_handed_over
  - id: LR-41
    cell: "`evidence_ids` условием не служат — служба пишет в журнал прогона, существует ли каждая (ADR-0040 п. 1)"
    test: tests/loop_tools/test_loop_rules.py::test_a_finish_with_a_missing_reference_is_accepted_and_the_journal_says_it_is_missing

# Правила, которые вводят другие шаги; до них тестов нет и быть не должно.
deferred:
  - step: "17"
    cell: "атом с кодом в `new_atoms` — только до шага 17 (автор в службе, ADR-0029), затем `ОТКАЗ неверные_аргументы` с подсказкой «подзадача и `aifa_register_atom`»"
  - step: "17"
    cell: "подсказки цикла («входов ещё нет», файл не собран) после шага 17 ведут к подзадаче и `aifa_register_atom`"
  - step: "16"
    cell: "шаг с `eph`-атомом из `aifa_register_atom` исполняется как любой атом"
