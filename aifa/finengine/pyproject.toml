[project]
name = "finengine"
version = "0.1.0"
description = "Financial IFRS Analysis Agent"
requires-python = ">=3.12"
dependencies = [
    # Storage clients; SQLAlchemy loads psycopg by the database URL.
    "boto3>=1.35",
    "botocore>=1.35",
    "redis>=5",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    # Model adapters used by the current runtime.
    "openai>=1.50.0",
    "gigachat>=0.1.39",
    # HTTP API, forms, WebSocket transport and environment settings.
    "fastapi>=0.115.0",
    "starlette>=0.40.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "httpx>=0.28.0",
    "websockets>=14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "typing-extensions>=4.12.0",
    # PDF/OCR ingestion and spreadsheet input/output.
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "pytesseract>=0.3.13",
    "pillow>=10.4.0",
    "openpyxl>=3.1.5",
    # Skill schemas, news connectors and configuration.
    "jsonschema>=4.0",
    "feedparser>=6.0.11",
    "pyyaml>=6.0.2",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.49.0",
    "sentry-sdk[fastapi]>=2.18.0",
    # Passlib loads bcrypt dynamically; jose uses its cryptography backend.
    "passlib>=1.7.4",
    "bcrypt>=4.0,<5.0",
    "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finengine"]

[tool.ruff]
line-length = 100
target-version = "py312"

# 🔴 НАБОР ПРАВИЛ ЗАФИКСИРОВАН ЯВНО (07.09.2026). Это классический набор ruff по
# умолчанию, под которым живёт весь код. Без явного `select` набор берётся из
# версии ruff — а версия у каждого своя (`ruff>=0.8.0`): у разработчиков 0.15
# (59 правил), в CI встал 0.16.6 (413 правил), и первый же PR, тронувший
# python, покраснел на ~80 находках в строках, которых не касался (B008 у
# Depends, S110, RUF100…). Расширять набор — можно и нужно, но осознанно и с
# уборкой долга, а не сменой версии в чужом окружении.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
