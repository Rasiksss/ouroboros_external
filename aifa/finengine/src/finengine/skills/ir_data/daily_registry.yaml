# Макропоказатели: что публикуется, по каким странам, с какой
# периодичностью, в каком сравнении выводить значение.
macro:
  - name: Динамика ВВП
    countries: [РФ, США, еврозона, Китай]
    frequency: ежеквартально
    comparison: кв/кв г/г

  - name: Потребительская инфляция
    countries: [РФ, США, еврозона, Китай]
    frequency: еженедельно по РФ, ежемесячно по остальным странам
    comparison: в РФ отдельно даются еженедельные принты и показатель в годовом выражении; г/г в США, еврозоне и Китае

  - name: Промышленная инфляция
    countries: [РФ, США, еврозона, Китай]
    frequency: ежемесячно
    comparison: г/г

  - name: PMI Services
    countries: [РФ, США, еврозона, Китай]
    frequency: ежемесячно
    comparison: м/м

  - name: PMI Manufacturing
    countries: [РФ, США, еврозона, Китай]
    frequency: ежемесячно
    comparison: м/м

  - name: Промышленное производство
    countries: [РФ, США, еврозона, Китай]
    frequency: ежемесячно
    comparison: м/м г/г

  - name: Consumer Sentiment Index (Conference Board)
    countries: [США]
    frequency: ежемесячно
    comparison: м/м

  - name: Розничные продажи
    countries: [США]
    frequency: ежемесячно
    comparison: м/м г/г

  - name: Non-Farm Payrolls (изменение занятости вне с/х)
    countries: [США]
    frequency: ежемесячно
    comparison: изм. за месяц

  - name: Уровень безработицы
    countries: [РФ, США, еврозона]
    frequency: ежемесячно
    comparison: м/м

  - name: Запасы сырой нефти EIA
    countries: [США]
    frequency: еженедельно
    comparison: изм. за неделю

# Регуляторы, что в фокусе мониторинга.
regulators:
  - name: ЦБ РФ
    country: РФ
    focus: Решения по ставке, изменения макропрогнозов, решения по регулированию банковского сектора, публикация обзоров банковского сектора и финансовых рынков

  - name: Минфин РФ
    country: РФ
    focus: Предложения по бюджетной и налоговой политике

  - name: ФРС
    country: США
    focus: Решения по ставке, изменения макропрогнозов

  - name: Минфин США
    country: США
    focus: Решения по санкциям против РФ

  - name: ЕЦБ
    country: еврозона
    focus: Решения по ставке, изменения макропрогнозов

  - name: Совет ЕС
    country: ЕС
    focus: Решения по санкциям против РФ

  - name: НБК
    country: Китай
    focus: Решения по ставке

