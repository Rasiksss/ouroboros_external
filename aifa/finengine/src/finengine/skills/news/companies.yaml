# Per-company direct-disclosure feeds.
#
# Connectors generated automatically at pipeline start from this catalog,
# one virtual source per entry. Each one fetches material events (8-K)
# straight from the company's official disclosure channel — no waiting
# for CNBC/Reuters to write about it.
#
# Fields:
#   canonical        display name (matches entities.watchlist_* in sources.yaml)
#   region           RU/US/EU/CN/global
#   ticker           stock ticker (informational)
#   edgar_cik        SEC Central Index Key — required for EDGAR connector
#   edgar_form       форма SEC для ленты: 8-K (умолчание, эмитенты США)
#                    или 6-K — ИНОСТРАННЫЕ эмитенты 8-K не подают вовсе,
#                    и запрос по 8-K отдаёт валидную ПУСТУЮ ленту навсегда
#   edisclosure_id   e-disclosure.ru company id (RU disclosures) — not yet active
#   ir_rss           direct RSS from company's IR page if available
#   ir_html_url      IR press-release page URL for HTML scrape fallback
#   weight           ranking weight (0.0..1.0). Official = 0.95+.

