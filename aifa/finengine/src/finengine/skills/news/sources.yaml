  # ===== US — Corporate press wires =====
  # PR Newswire / Business Wire / GlobeNewswire carry the actual company
  # press releases that journalists later rewrite into stories. Hitting
  # these directly catches M&A / partnerships / product launches 1-3h
  # before they show up in Reuters/CNBC.
  - id: pr_newswire
    display_name: PR Newswire
    type: wire
    region: global
    connector: rss
    # ⚠️ Прежний адрес (`/rss/news-releases-list.rss`) отдаёт HTTP 404 —
    # PR Newswire перестроили ленты. Взят их отраслевой фид: 20 свежих
    # записей против 100 у общего, и все по нашей теме. Общий тянул подряд
    # всё — от поглощений в кондитерке до розничных акций, а классификатору
    # это лишний шум при потолке в 60 кандидатов.
    url: https://www.prnewswire.com/rss/financial-services-latest-news/financial-services-latest-news-list.rss
    weight: 0.75

  - id: business_wire
    display_name: Business Wire
    type: wire
    region: global
    connector: rss
    # BW's own feed (feed.businesswire.com) is CF-fronted and blocks our
    # prod RU IP + the PL proxy at the TCP layer. Workaround: Google News
    # site-search RSS — Google indexes BW with ~30-60 min lag from the
    # original release, which is still 30-90 min ahead of Reuters/CNBC
    # rewrites. Same trick we use for Vedomosti.
    url: https://news.google.com/rss/search?q=site%3Abusinesswire.com+when%3A7d&ceid=US%3Aen&hl=en-US&gl=US
