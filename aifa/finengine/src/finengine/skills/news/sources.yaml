  # с rss|feed. Сеть ни при чём: pbc.gov.cn отдаёт HTTP 200 с боевого VPS.
  # Годится только HTML: раздел Announcements (url ниже) — 10 статей, сервер-
  # рендер, заголовки английские, дата зашита в путь статьи
  # (/en/.../2026081813512936692/index.html → 18.08.2026), свежайшая — сегодня.
  # Прежний адрес `pbc.gov.cn/redianzhuanti/index.html` заменён: это китайская
  # страница «горячих тем», а не лента публикаций.
  # ⚠️ ПОЧЕМУ НЕЛЬЗЯ ПРОСТО ПОСТАВИТЬ active: true. `connectors/html.py` берёт
  # разборщик из `_EXTRACTORS` по id источника; под `pboc` его там нет, и
  # коннектор вернёт [] с warning, не сходив в сеть. Источник числился бы
  # живым и пустым — тот же класс отказа, что был у reuters. Сторож
  # tests/test_regulator_sources_point_at_regulators.py держит эту связку.
  # ⚠️ Разборщик придётся проверять на VPS: с рабочего Mac pbc.gov.cn
  # недоступен (таймаут, порты 80/443 закрыты на обоих IP).
  - id: pboc
