# IR Daily News — catalog of feeds.
#
# Each entry produces a Connector at startup. New sources go through git
# review (compliance trail per УЭК-АУА-13).
#
# Fields:
#   id           stable key, used as foreign key in raw_items
#   display_name human-readable, shown in markdown
#   type         official | wire | tier1 | wire_tg | aggregator
#   region       RU | US | EU | CN | global
#   connector    rss | html | api | telegram | tavily_fallback
#   url          feed URL or API endpoint (depends on connector)
#   weight       0.0..1.0 — multiplier in ranking
#   active       false → exclude from collect step (without deleting)

sources:
  # ===== Russia — Regulators (highest weight) =====
  # NB: ЦБ RSS URL'ы БЕЗ trailing slash — иначе 404.
  - id: cbr_press
    display_name: ЦБ РФ
    type: official
    region: RU
    connector: rss
    url: http://www.cbr.ru/rss/RssPress
    weight: 1.0

  - id: cbr_news
    display_name: ЦБ РФ — Новости
    type: official
    region: RU
    connector: rss
    url: http://www.cbr.ru/rss/RssNews
    weight: 1.0

  - id: cbr_events
    display_name: ЦБ РФ — Выступления
    type: official
    region: RU
    connector: rss
    url: http://www.cbr.ru/rss/eventrss
    weight: 0.95

  # Росстат — лента ЕГО СОБСТВЕННЫХ выпусков (18.08.2026).
  #
  # Здесь стоял фид правительства `government.ru/department/456` — раздел
  # «О Росстате», а не публикации Росстата. Замер 18.08: лента жива (HTTP 200,
  # 20 записей), но свежайшая запись от 25.06 — поздравление с профессиональным
  # праздником, публикаций статистики нет НИ ОДНОЙ. Выпуск честно писал «за
  # 7 дней нет», держа не тот шланг: сам Росстат печатает недельную инфляцию
  # каждую среду.
  # `central-news/rss` — она и есть: HTTP 200, 6690 байт, 20 записей,
  # bozo=False, «Об оценке индекса потребительских цен с N по M» по средам без
  # пропусков, плюс ИПЦ за месяц, ВВП, ИЦП, промпроизводство.
  # ⚠️ `announcements/rss` НЕ БРАТЬ, хотя формально исправна: там даты БУДУЩИЕ
  # (это анонсы выхода), а `rank.py:_freshness` на отрицательной дельте даёт
  # свежесть 1.0 — ещё не вышедшая статистика вытеснила бы реальные новости.
  # ⚠️ Сертификат выдан НУЦ Минцифры: без `net/ru_gov_tls.verify_for` сбор
  # падает в CERTIFICATE_VERIFY_FAILED (подключено в connectors/rss.py).
  # ⚠️ Ритм недельный: при окне сбора 48 ч записи приезжают в среду вечером и
  # в четверг, в остальные дни ноль — это не отказ источника.
  - id: rosstat_gov
    display_name: Росстат
    type: official
    region: RU
    connector: rss
    url: https://rosstat.gov.ru/central-news/rss
    weight: 0.95

