# Реестр факторов для декомпозиции отклонения "Факт − План".
#
# 9 факторов из ТЗ ТМХ (стр. 4-5 PDF). Каждый — отдельный YAML-блок,
# реестр-driven: добавление 10-го фактора = новая запись здесь, кода не
# трогаем. Это и есть "шаг влево, шаг вправо" под кастомизацию заказчика.
#
# Поля:
#   id         — машинный код, фигурирует в выводе и API
#   name       — русское название для отчёта
#   group      — группировка для UI/отчёта (revenue / cost / mixed)
#   method     — chain | laspeyres | paasche | absolute
#                ▸ chain    — цепная подстановка (для 3+ факторов одной метрики)
#                ▸ laspeyres— весовая декомпозиция Δ × baseline-weight
#                ▸ absolute — просто Факт − План, без декомпозиции
#   formula    — словесная формула для трейсабильности и презентации
#   description— что фактор объясняет (бизнес-смысл)
#   order      — порядок проходов в chain-substitution (lower = first)

factors:
  - id: volume
    name: "Объём реализации"
    group: revenue
    method: chain
    order: 10
    formula: "ΔQ × P_план × Доля_план"
    description: |
      Изменение выручки из-за того, что фактически продали больше/меньше
      штук, чем планировали. Цены и структура портфеля фиксируются на
      плановых.

  - id: structure
    name: "Структура реализации"
    group: revenue
    method: chain
    order: 20
    formula: "Q_факт × ΔДоля × P_план"
    description: |
      Сдвиг доли каждого продукта в портфеле относительно плана. Если
      агрегатная выручка та же, но доля высокомаржинального продукта
      упала — структурный фактор отрицательный.

  - id: price
    name: "Цена реализации"
    group: revenue
    method: chain
    order: 30
    formula: "Q_факт × Доля_факт × ΔP"
    description: |
      Скидки, изменение прайс-листа, рост/падение средней цены реализации.
      Считается на фактическом объёме и фактической структуре (последний
      проход chain substitution).

  - id: materials
    name: "Материалы и комплектующие"
    group: cost
    method: laspeyres
    order: 40
    formula: "Δ(норма_расхода) × цена_план + норма_факт × Δ(цена)"
    description: |
      Двухуровневая декомпозиция себестоимости по статье "Материалы":
      перерасход норматива и удорожание поставщиков. Применяется
      Лайспейрес — нормативы по плановым ценам, цены — по фактическим
      нормативам.

  - id: labor
    name: "ФОТ производственного персонала"
    group: cost
    method: laspeyres
    order: 50
    formula: "Δ(трудозатраты) × ставка_план + час_факт × Δ(ставка)"
    description: |
      Аналогично материалам, но норма = трудозатраты на ед., цена = часовая
      ставка. В демо упрощено до Δ(ФОТ на единицу) без расщепления на
      «часы × ставка» — справочника часов в синтетике нет.

  - id: overhead_plant
    name: "Накладные расходы хозяйственной службы"
    group: cost
    method: absolute
    order: 60
    description: |
      Накладные завода (хоз.службы, склад, цеховые расходы). Декомпозиция
      по продуктам через распределение пропорционально плановой
      себестоимости (по умолчанию).

  - id: overhead_mgmt
    name: "Накладные расходы управляющей компании"
    group: cost
    method: absolute
    order: 70
    description: |
      Накладные УК — корпоративные функции, аллоцированные на завод.
      Часто не управляются заводом → подсвечиваем отдельно от plant.

  - id: quality
    name: "Затраты на качество (ОТК)"
    group: cost
    method: absolute
    order: 80
    description: |
      Затраты ОТК и предупредительный контроль качества. Связан с
      гарантийным фактором: рост QUALITY часто следствие роста брака.

  - id: warranty
    name: "Гарантийные обязательства"
    group: cost
    method: absolute
    order: 90
    description: |
      Резерв и фактические затраты по гарантии. Скачок > 50% — сигнал
      о росте уровня дефектов на партии.

# Методологические пресеты для разных сценариев. Default ВКЛЮЧАЕТ все
# 9 факторов — пользователь не должен знать YAML-ключи. Сокращённые
# пресеты — для будущих "коротких" UI-кнопок ("только выручка").
presets:
  default:
    # ПО УМОЛЧАНИЮ — полный набор 9 факторов по ТЗ ТМХ
    factors: [volume, structure, price, materials, labor, overhead_plant,
              overhead_mgmt, quality, warranty]
    explanation: "Полный факторный анализ (9 факторов по ТЗ)"

  mvp:
    # MVP-демо: ключевые 4 фактора (выручка + материалы)
    factors: [volume, structure, price, materials]
    explanation: "MVP: декомпозиция выручки + материалы"

  revenue_only:
    factors: [volume, structure, price]
    explanation: "Только выручка — Q × структура × P"
