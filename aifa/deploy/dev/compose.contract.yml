# Контрактный профиль `contract` (шаг 07; ARCHITECTURE.md §2, PRINCIPLES.md §Б.4): настоящий
# ouroboros с теми же настройками, что на dev (читает ouroboros.env.example), но модель — подставной
# сервер aifa/tests/stub_model. Без Workstation (тесты с ним — живые).
#
# Службы расчётов в профиле нет как контейнера: сквозной тест шага 10 поднимает её сам, в своём процессе,
# с фикстурным документом и подставным разбором цели (эти подмены живут в процессе службы), а ouroboros
# ходит к ней по сети — на хост через `host.docker.internal` (порт `AIFA_ENGINE_URL` ниже). Контейнерная
# служба на dev — шаг 12.
#
# Только локально: отдельный compose-проект и свои тома, контейнеры dev-контура `aifa-sym` не
# затрагиваются; на общий dev этот файл не выкатывается. Секреты ниже — заглушки на время теста:
# порты открыты только на 127.0.0.1, данные живут в томах `aifa-sym-contract-*` (`down -v` сносит).
#
#   docker compose -f aifa/deploy/dev/compose.contract.yml --profile contract up -d --build --wait
#   AIFA_CONTRACT_OURO_URL=ws://127.0.0.1:18181/ws AIFA_CONTRACT_STUB_URL=http://127.0.0.1:18182 \
#       uv run ... pytest aifa/tests/contract            # см. aifa/tests/contract/README.md
#   docker compose -f aifa/deploy/dev/compose.contract.yml --profile contract down -v

name: aifa-sym-contract

services:
  ouroboros:
    profiles: [contract]
    build:
      context: ../../..
      dockerfile: aifa/deploy/dev/ouroboros.Dockerfile
    image: aifa-sym-ouroboros:dev
    init: true
    mem_limit: 1536m
    # Набор dev целиком (ADR-0027): отличается только то, что в `environment` ниже.
    env_file: ouroboros.env.example
    environment:
      OUROBOROS_ENV: production
      OUROBOROS_DATA_DIR: /data
      OUROBOROS_SERVER_HOST: 0.0.0.0
      # Модели называются по ролям, чтобы правила сценария различали основную, лёгкую и запасную.
      OUROBOROS_MODEL: cloudru::stub-main
      OUROBOROS_MODEL_LIGHT: cloudru::stub-light
      OUROBOROS_MODEL_FALLBACK: cloudru::stub-fallback
      # Единственная подмена: адрес поставщика cloudru (SETTINGS.md §2.4) — правок ouroboros нет.
      CLOUDRU_FOUNDATION_MODELS_BASE_URL: http://stub-model:8000/v1
      CLOUDRU_FOUNDATION_MODELS_API_KEY: stub
      OUROBOROS_RUNTIME_DB_URL: postgresql+psycopg://ouroboros:contract@ouro-postgres:5432/ouroboros
      OUROBOROS_S3_ACCESS_KEY: contract
      OUROBOROS_S3_SECRET_KEY: contract-secret
      # 64 нулевых байта в base64: заглушка, настоящих учётных данных в этих томах нет.
      OUROBOROS_CREDENTIALS_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==
      WORKSTATION_CREATE_SECRET: contract
      # Служба расчётов — процесс сквозного теста на хосте (aifa/tests/contract/engine_host.py); секрет — заглушка.
      AIFA_ENGINE_URL: http://host.docker.internal:18183
      AIFA_ENGINE_TOKEN: contract-engine-token
      # C2.4 нужна подзадача, а на dev `schedule_task` выключен до шага 16 (ADR-0044 п. 3). Список —
      # пример без этого имени; `test_contract_compose.py` держит их равными.
      OUROBOROS_DISABLED_TOOLS: attachment_read,vlm_query,data_read,data_list,data_write,send_file,send_image,send_photo,send_user_message,gigasearch,browse_page,browser_action,image_generate,memory_save,memory_read,memory_list,memory_delete,create_scheduled_task,create_reminder,list_schedules,edit_schedule,cancel_schedule,pause_schedule,resume_schedule,confirm_schedule,move_schedule_here
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:18181:8080"
    volumes:
      - ouro-data:/data
    depends_on:
      ouro-postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      stub-model:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=5)
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 60s
    networks: [internal]

  stub-model:
    profiles: [contract]
    image: python:3.12-slim
    working_dir: /app
    command: [python, -m, stub_model, --port, "8000"]
    user: "65534:65534"
    environment:
      PYTHONPATH: /app
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:18182:8000"
    volumes:
      - ../../tests/stub_model:/app/stub_model:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [internal]

  ouro-postgres:
    profiles: [contract]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ouroboros
      POSTGRES_USER: ouroboros
      POSTGRES_PASSWORD: contract
    volumes:
      - ouro-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ouroboros -d ouroboros"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [internal]

  s3:
    profiles: [contract]
    image: chrislusf/seaweedfs:4.48
    command: [server, -dir=/data, -s3, -s3.port=8333, -master.volumeSizeLimitMB=512]
    environment:
      AWS_ACCESS_KEY_ID: contract
      AWS_SECRET_ACCESS_KEY: contract-secret
    volumes:
      - s3-data:/data
    healthcheck:
      test: [CMD-SHELL, "nc -z 127.0.0.1 8333"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks: [internal]

  s3-init:
    profiles: [contract]
    image: amazon/aws-cli:2.38.1
    restart: "no"
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: contract
      AWS_SECRET_ACCESS_KEY: contract-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: [sh, -c]
    command:
      - >-
        aws --endpoint-url http://s3:8333 s3api head-bucket --bucket ouroboros 2>/dev/null ||
        aws --endpoint-url http://s3:8333 s3 mb s3://ouroboros
    networks: [internal]

networks:
  internal:
    name: aifa-sym-contract-internal
    driver: bridge

volumes:
  ouro-data:
    name: aifa-sym-contract-ouro-data
  ouro-pgdata:
    name: aifa-sym-contract-ouro-pgdata
  s3-data:
    name: aifa-sym-contract-s3-data
